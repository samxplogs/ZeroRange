<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" id="stage1-scene">
<style>
:root { --bg:#0e0e0e; --fg:#d8d3c8; --accent:#ff6a00; --red:#e23a3a; --green:#39d353; }

/* Door panel */
#door-panel { transition: transform .6s ease; }

/* RF wave — flies left-to-right */
.rf-wave { opacity: 0; }
.rf-wave.fly {
  animation: fly-wave .7s ease-out forwards;
}
@keyframes fly-wave {
  from { transform: translateX(0); opacity: 1; }
  to   { transform: translateX(-120px); opacity: 0; }
}

/* REJECT stamp */
#reject-stamp {
  opacity: 0;
  font-family: monospace;
  font-size: 14px;
  font-weight: bold;
  fill: #e23a3a;
  transform-origin: 150px 90px;
}
#reject-stamp.show {
  animation: stamp-in .3s ease-out forwards;
}
@keyframes stamp-in {
  0%  { opacity: 0; transform: scale(2) rotate(-15deg); }
  60% { opacity: 1; transform: scale(.9) rotate(-8deg); }
  100%{ opacity: 1; transform: scale(1) rotate(-10deg); }
}

/* OPEN flash */
#open-flash {
  opacity: 0;
  font-family: monospace;
  font-size: 14px;
  font-weight: bold;
  fill: #39d353;
}
#open-flash.show {
  animation: flash-in .5s ease-out forwards;
}
@keyframes flash-in {
  0%  { opacity: 0; }
  50% { opacity: 1; }
  100%{ opacity: .85; }
}

/* Counter digits tick */
.ctr-digit { font-family: monospace; font-size: 12px; fill: #d8d3c8; }

/* JAM badge */
#jam-badge {
  opacity: 0;
  transition: opacity .3s;
}
#jam-badge.show { opacity: 1; }

/* Captured tray icons */
.tray-frame { opacity: 0; transition: opacity .2s; }
.tray-frame.held { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .rf-wave.fly, #reject-stamp.show, #open-flash.show { animation: none !important; opacity: 1; }
  #door-panel { transition: none; }
}
</style>

<!-- Background -->
<rect width="300" height="180" fill="#0e0e0e"/>

<!-- Driveway -->
<rect x="0" y="150" width="300" height="30" fill="#1a1a1a"/>
<line x1="0" y1="150" x2="300" y2="150" stroke="#333" stroke-width="1"/>

<!-- Garage door frame -->
<rect x="60" y="20" width="140" height="130" rx="2" fill="none" stroke="#d8d3c8" stroke-width="2"/>

<!-- Door panel group (slides up on open) -->
<g id="door-panel">
  <rect x="62" y="22" width="136" height="20" rx="1" fill="#2a2a2a" stroke="#d8d3c8" stroke-width="1"/>
  <rect x="62" y="43" width="136" height="20" rx="1" fill="#2a2a2a" stroke="#d8d3c8" stroke-width="1"/>
  <rect x="62" y="64" width="136" height="20" rx="1" fill="#2a2a2a" stroke="#d8d3c8" stroke-width="1"/>
  <rect x="62" y="85" width="136" height="20" rx="1" fill="#2a2a2a" stroke="#d8d3c8" stroke-width="1"/>
  <rect x="62" y="106" width="136" height="20" rx="1" fill="#2a2a2a" stroke="#d8d3c8" stroke-width="1"/>
  <rect x="62" y="127" width="136" height="22" rx="1" fill="#2a2a2a" stroke="#d8d3c8" stroke-width="1"/>
</g>

<!-- Counter display above door -->
<rect x="100" y="4" width="60" height="14" rx="2" fill="#111" stroke="#333"/>
<text id="counter-display" x="130" y="14" text-anchor="middle" class="ctr-digit" id="ctr-text">0100</text>

<!-- Remote (right side) -->
<rect x="245" y="80" width="30" height="50" rx="4" fill="#222" stroke="#d8d3c8" stroke-width="1.5"/>
<rect x="253" y="88" width="14" height="8" rx="2" fill="#ff6a00"/>
<text x="260" y="120" text-anchor="middle" font-family="monospace" font-size="7" fill="#666">REMOTE</text>

<!-- RF wave glyphs (fly from remote toward door) -->
<g class="rf-wave" id="rf-wave-1">
  <text x="220" y="102" font-family="monospace" font-size="10" fill="#ff6a00">~</text>
  <text x="210" y="102" font-family="monospace" font-size="10" fill="#ff6a00" opacity=".6">~</text>
  <text x="200" y="102" font-family="monospace" font-size="10" fill="#ff6a00" opacity=".3">~</text>
</g>

<!-- REJECT stamp -->
<text id="reject-stamp" x="130" y="95" text-anchor="middle">REJECT</text>

<!-- OPEN flash -->
<text id="open-flash" x="130" y="95" text-anchor="middle">OPEN</text>

<!-- JAM badge (top-right of door) -->
<g id="jam-badge">
  <rect x="172" y="22" width="26" height="12" rx="2" fill="#e23a3a"/>
  <text x="185" y="31" text-anchor="middle" font-family="monospace" font-size="7" fill="#fff" font-weight="bold">JAM</text>
</g>

<!-- Captured tray (bottom-left) -->
<text x="10" y="165" font-family="monospace" font-size="7" fill="#666">TRAY:</text>
<rect class="tray-frame" id="tray-0" x="38" y="157" width="10" height="10" rx="1" fill="none" stroke="#ff6a00" stroke-width="1.5"/>
<rect class="tray-frame" id="tray-1" x="52" y="157" width="10" height="10" rx="1" fill="none" stroke="#ff6a00" stroke-width="1.5"/>
</svg>
