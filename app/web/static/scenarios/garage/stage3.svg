<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180">
<style>
/* Card slide in */
#mifare-card { animation: card-slide 3s ease-in-out infinite; }
@keyframes card-slide {
  0%,20%  { transform: translateX(80px); opacity: 0; }
  40%,60% { transform: translateX(0); opacity: 1; }
  80%,100%{ transform: translateX(0); opacity: 1; }
}

/* Hex bytes cascade */
.hex-byte { opacity: 0; }
.hex-byte:nth-child(1) { animation: hex-cascade 3s .8s infinite; }
.hex-byte:nth-child(2) { animation: hex-cascade 3s 1.0s infinite; }
.hex-byte:nth-child(3) { animation: hex-cascade 3s 1.2s infinite; }
.hex-byte:nth-child(4) { animation: hex-cascade 3s 1.4s infinite; }
.hex-byte:nth-child(5) { animation: hex-cascade 3s 1.6s infinite; }
.hex-byte:nth-child(6) { animation: hex-cascade 3s 1.8s infinite; }
@keyframes hex-cascade {
  0%   { opacity: 0; transform: translateY(-6px); }
  30%  { opacity: 1; transform: translateY(0); }
  70%  { opacity: 1; }
  100% { opacity: 0; }
}

/* Lock LED: red → green */
#lock-led { animation: led-toggle 3s 2s infinite; }
@keyframes led-toggle {
  0%,40%  { fill: #e23a3a; }
  50%,100%{ fill: #39d353; }
}

/* ACCESS GRANTED overlay */
#access-granted {
  opacity: 0;
  animation: granted-flash 3s 2.1s infinite;
}
@keyframes granted-flash {
  0%,40% { opacity: 0; }
  50%    { opacity: 1; }
  90%    { opacity: 1; }
  100%   { opacity: 0; }
}

/* Server rack blink */
.rack-led { animation: rack-blink 1s ease-in-out infinite alternate; }
.rack-led:nth-child(2) { animation-delay: .3s; }
.rack-led:nth-child(3) { animation-delay: .6s; }

@media (prefers-reduced-motion: reduce) {
  #mifare-card, .hex-byte, #lock-led, #access-granted, .rack-led { animation: none !important; }
  #mifare-card { opacity: 1; transform: translateX(0); }
  .hex-byte { opacity: 1; }
  #lock-led { fill: #39d353; }
  #access-granted { opacity: 1; }
}
</style>

<rect width="300" height="180" fill="#0e0e0e"/>
<!-- Server rack silhouette -->
<rect x="20" y="20" width="100" height="130" rx="4" fill="#111" stroke="#333" stroke-width="2"/>
<!-- Rack units -->
<rect x="25" y="28" width="90" height="12" rx="1" fill="#1a1a1a" stroke="#333"/>
<rect x="25" y="44" width="90" height="12" rx="1" fill="#1a1a1a" stroke="#333"/>
<rect x="25" y="60" width="90" height="12" rx="1" fill="#1a1a1a" stroke="#333"/>
<rect x="25" y="76" width="90" height="12" rx="1" fill="#1a1a1a" stroke="#333"/>
<rect x="25" y="92" width="90" height="12" rx="1" fill="#1a1a1a" stroke="#333"/>
<rect x="25" y="108" width="90" height="12" rx="1" fill="#1a1a1a" stroke="#333"/>
<rect x="25" y="124" width="90" height="12" rx="1" fill="#1a1a1a" stroke="#333"/>
<!-- Rack LEDs (blue glow) -->
<g>
  <circle class="rack-led" cx="106" cy="34" r="3" fill="#4488ff" opacity=".7"/>
  <circle class="rack-led" cx="106" cy="50" r="3" fill="#4488ff" opacity=".7"/>
  <circle class="rack-led" cx="106" cy="66" r="3" fill="#4488ff" opacity=".7"/>
</g>

<!-- Card reader slot (wall right of rack) -->
<rect x="148" y="70" width="12" height="40" rx="2" fill="#222" stroke="#d8d3c8" stroke-width="1.5"/>
<rect x="149" y="78" width="10" height="2" rx="0" fill="#444"/>
<!-- Lock LED -->
<circle id="lock-led" cx="154" cy="68" r="5" fill="#e23a3a"/>

<!-- MIFARE card sliding in -->
<g id="mifare-card">
  <rect x="160" y="82" width="50" height="30" rx="3" fill="#1a3a5c" stroke="#4488ff" stroke-width="1.5"/>
  <rect x="163" y="85" width="12" height="10" rx="1" fill="#d4a800" opacity=".8"/>
  <text x="185" y="96" text-anchor="middle" font-family="monospace" font-size="6" fill="#aaa">MIFARE</text>
  <text x="185" y="104" text-anchor="middle" font-family="monospace" font-size="5" fill="#888">CLASSIC 1K</text>
</g>

<!-- Hex bytes cascade from card -->
<g transform="translate(165,78)">
  <text class="hex-byte" x="0" y="-4" font-family="monospace" font-size="7" fill="#ff6a00">F1</text>
  <text class="hex-byte" x="14" y="-4" font-family="monospace" font-size="7" fill="#ff6a00">5E</text>
  <text class="hex-byte" x="28" y="-4" font-family="monospace" font-size="7" fill="#ff6a00">C0</text>
  <text class="hex-byte" x="42" y="-4" font-family="monospace" font-size="7" fill="#ff6a00">DE</text>
  <text class="hex-byte" x="0"  y="-13" font-family="monospace" font-size="7" fill="#ff6a00">00</text>
  <text class="hex-byte" x="14" y="-13" font-family="monospace" font-size="7" fill="#ff6a00">17</text>
</g>

<!-- ACCESS GRANTED overlay -->
<g id="access-granted">
  <rect x="40" y="78" width="100" height="24" rx="3" fill="#0a2a0a" stroke="#39d353" stroke-width="1.5"/>
  <text x="90" y="94" text-anchor="middle" font-family="monospace" font-size="9" fill="#39d353" font-weight="bold">ACCESS GRANTED</text>
</g>
</svg>
